<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bonds University" />
  <title>Bonds University</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      width: min(90%, 720px);
      padding: 3rem 2rem;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(23, 32, 51, 0.1);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #526078;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Bonds University</h1>
    <p>Your learning journey starts here.</p>
  </main>
</body>
</html>
